[package]
name = "nxp-pcf8523"
version = "2.0.0"
edition = "2024"
authors = ["Jonathan D. Baker <jonathan@ardent.tech>"]
description = "A no-std driver for the NXP PCF8523 RTC and calendar module."
keywords = ["embedded", "embedded-hal-driver", "rtc"]
categories = ["embedded", "no-std"]
repository = "https://github.com/ardentTech/nxp-pcf8523"
license = "MIT OR Apache-2.0"
exclude = ["CHANGELOG.md", "tests/*", "examples/*"]
readme = "README.md"

[dependencies]
embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-async = "1.0.0"
maybe-async = "0.2"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1", "embedded-hal-async"] }
[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]

[features]
sync = ["maybe-async/is_sync", "dep:embedded-hal"]

[profile.release]
overflow-checks = true
